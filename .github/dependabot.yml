version: 2
updates:
  # The template repository itself.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]

  # The generated project. Its pyproject.toml contains Jinja, so its Python
  # lower bounds are bumped by hand; actions and hooks are plain YAML.
  - package-ecosystem: github-actions
    directory: /{{cookiecutter.project_slug}}
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      template-github-actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /{{cookiecutter.project_slug}}
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      template-pre-commit:
        patterns: ["*"]
