# The target Python version is inferred from `requires-python` in pyproject.toml.
line-length = 80

[format]
docstring-code-format = true

[lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "CPY001", # no copyright header in every file
    "D100",   # missing docstring in public module
    "D101",   # missing docstring in public class
    "D103",   # missing docstring in public function
    "D104",   # missing docstring in public package
    "D401",   # first line of docstring in imperative mood
    "E501",   # line length is handled by the formatter
    "FIX002", # TODOs are allowed ...
    "TD002",  # ... without an author
    "TD003",  # ... and without an issue link
]

[lint.per-file-ignores]
"tests/**" = [
    "PLR2004", # magic values in assertions
    "S101",    # assert
]
"scripts/**" = [
    "INP001", # scripts are not part of a package
    "T201",   # print
]
"*.ipynb" = [
    "B018",   # bare expressions display output
    "INP001", # notebooks are not part of a package
    "T201",   # print
]
"src/*/__init__.py" = [
    "D205", # pdoc include directive in the package docstring
    "D400",
]

[lint.mccabe]
max-complexity = 10

[lint.pydocstyle]
convention = "numpy"
