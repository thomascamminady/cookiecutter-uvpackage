# Ruff, ty and pytest run through `uv run`, so they use the exact versions
# pinned in uv.lock (updated by Dependabot) instead of a second set of pins.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.0
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        types_or: [python, pyi, jupyter]
        pass_filenames: false
        require_serial: true
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types_or: [python, pyi, jupyter]
        pass_filenames: false
        require_serial: true
